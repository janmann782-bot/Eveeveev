[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timofey-ai"
version = "2.0.0"
description = "Satirical Aurelia news desk and President Ralizm"
requires-python = ">=3.11"
dependencies = ["aiogram==3.31.0", "httpx[socks]==0.28.1", "python-dotenv==1.2.4", "aiohttp-socks==0.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["timofey*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
